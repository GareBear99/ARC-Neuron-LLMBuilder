name: ARC Cognition Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository smoke check
        run: |
          echo "Repository checkout succeeded."
          echo "ARC-Neuron main CI is stable."
          echo "PASS"

      - name: Check package artifacts are not in repo root
        run: |
          BAD="$(find . -maxdepth 1 -type f \( -name '*.patch' -o -name 'APPLY_*.sh' -o -name 'APPLY_NOTES.md' \) -print)"
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "ERROR: drop-in/package artifacts found in repo root."
            exit 1
          fi
          echo "No root package artifacts found."

      - name: Check private key safety
        run: |
          BAD="$(git ls-files | grep -E '(^|/)receipt_signing\.key$' || true)"
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "ERROR: private signing key is tracked."
            exit 1
          fi
          echo "Private key check passed."

      - name: Check required docs exist
        run: |
          test -f README.md
          echo "README exists."

         ame: Print optional docs status
        run: |
          for f in ECOSYSTEM.md ROADMAP.md SECURI      .github/SECURITY.md CONTRIBUTING.md SUPPORT.md; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "OPTIONAL MISSING: $f"
            fi
          done
